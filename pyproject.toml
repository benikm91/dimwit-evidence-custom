[project]
name = "dimwit-evidence-custom"
version = "0.1.0"
description = "Reconstructions of 15 real tensor-shape defects from well-known repositories, scored against plain Python/NumPy, plain JAX, jaxtyping and DimWit."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "jax>=0.4.26",
    "jaxtyping>=0.2.28",
    "beartype>=0.18",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["cases"]
python_files = ["plain.py", "plain_jax.py", "jaxtyping_case.py"]
filterwarnings = ["ignore::DeprecationWarning"]
# every case directory uses the same three file names, so pytest must import them by
# path rather than by basename
addopts = "--import-mode=importlib"
consider_namespace_packages = true
